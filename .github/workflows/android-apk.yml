name: Construire APK BM BLACK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Capacitor
        run: npm install
      - name: Préparer les fichiers de l'application
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp -R assets www/assets
      - name: Générer le projet Android
        run: npx cap add android
      - name: Créer l'icône premium BM BLACK
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path("assets/app-icon.svg")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder, size in sizes.items():
              target = Path("android/app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)
              subprocess.run(["convert", "-background", "none", str(source), "-resize", f"{size}x{size}", str(target / "ic_launcher.png")], check=True)
              subprocess.run(["convert", "-background", "none", str(source), "-resize", f"{size}x{size}", str(target / "ic_launcher_round.png")], check=True)
          PY
      - name: Ajouter le service natif d'impression Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          main = Path("android/app/src/main/java")
          files = list(main.rglob("MainActivity.java"))
          if not files:
              raise SystemExit("MainActivity.java introuvable")
          activity = files[0]
          source = activity.read_text()
          match = re.search(r'^package ([A-Za-z0-9_.]+);', source, re.M)
          if not match:
              raise SystemExit("Package Android introuvable")
          package = match.group(1)
          activity.write_text("""package %s;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void printWebView(String name) {
                          runOnUiThread(() -> {
                              PrintManager manager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              WebView webView = getBridge().getWebView();
                              if (manager == null || webView == null) return;
                              String jobName = (name == null || name.isEmpty()) ? "BM BLACK Billets" : name;
                              PrintAttributes attributes = new PrintAttributes.Builder()
                                  .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                  .setColorMode(PrintAttributes.COLOR_MODE_COLOR)
                                  .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                  .build();
                              manager.print(jobName, webView.createPrintDocumentAdapter(jobName), attributes);
                          });
                      }
                  }, "BMPrint");
              }
          }
          """ % package)
          PY
      - name: Autoriser le scan par caméra
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.CAMERA' not in s:
              s = s.replace(marker, marker + '\n    <uses-permission android:name="android.permission.CAMERA" />', 1)
          p.write_text(s)
          q = Path("android/app/src/main/res/values/strings.xml")
          t = q.read_text()
          import re
          t = re.sub(r'(<string name="app_name">).*?(</string>)', r'\1BM BLACK\2', t, count=1)
          q.write_text(t)
          PY
      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BM BLACK APK ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: APK Android de test BM BLACK. Installe le fichier APK sur un téléphone Android.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Conserver aussi l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: BM-BLACK-Billetterie-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
